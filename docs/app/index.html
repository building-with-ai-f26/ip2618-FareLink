<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LinkWise — Smarter connections, every day</title>
  <style>
    :root {
      --bg-top: #0b1220;
      --bg-bot: #111a2e;
      --card: #16213a;
      --card-2: #1d2b49;
      --border: #2a3b5e;
      --text: #f4f7ff;
      --muted: #9fb0d0;
      --brand: #6366f1;
      --brand-2: #22d3ee;
      --comfy: #22c55e;
      --soon: #f59e0b;
      --go: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      line-height: 1.5;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2a4a 0%, var(--bg-top) 45%, var(--bg-bot) 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 80px; }

    /* Brand */
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 4px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px; flex: none;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      display: grid; place-items: center; font-weight: 900; color: #fff; font-size: 20px;
      box-shadow: 0 6px 18px rgba(99,102,241,.35);
    }
    h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
    .tagline { color: var(--muted); font-size: 14px; margin: 0 0 10px 51px; }
    .mock-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11.5px; color: #c7f9ff; background: rgba(34,211,238,0.12);
      border: 1px solid rgba(34,211,238,0.35); padding: 3px 10px; border-radius: 999px;
      margin: 0 0 20px 51px;
    }
    .mock-pill::before { content: "●"; color: var(--brand-2); font-size: 9px; }

    .hint { color: var(--muted); font-size: 14px; margin: 6px 0; }

    /* ===== Countdown (centerpiece) ===== */
    #countdown { margin-bottom: 20px; }
    .cd-card {
      border-radius: 22px; padding: 24px 20px 20px; text-align: center;
      border: 1px solid var(--border); position: relative; overflow: hidden;
      transition: background .4s ease, box-shadow .4s ease;
    }
    .cd-empty { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 30px 20px; text-align: center; }
    .state-comfy { background: linear-gradient(165deg, rgba(34,197,94,.22), rgba(22,33,58,.9)); box-shadow: 0 10px 40px rgba(34,197,94,.18); }
    .state-soon  { background: linear-gradient(165deg, rgba(245,158,11,.26), rgba(22,33,58,.9)); box-shadow: 0 10px 40px rgba(245,158,11,.22); }
    .state-go    { background: linear-gradient(165deg, rgba(239,68,68,.32), rgba(22,33,58,.92)); box-shadow: 0 10px 46px rgba(239,68,68,.3); animation: pulse 1.1s ease-in-out infinite; }
    .state-none  { background: var(--card); }
    @keyframes pulse { 0%,100% { box-shadow: 0 10px 40px rgba(239,68,68,.25); } 50% { box-shadow: 0 10px 60px rgba(239,68,68,.55); } }

    .cd-leg { font-size: 12.5px; color: var(--muted); letter-spacing: .03em; }
    .cd-op { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; margin: 8px 0 4px; }
    .cd-op-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--op, var(--brand)); box-shadow: 0 0 10px var(--op, var(--brand)); }
    .cd-headline { font-size: 15px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin: 2px 0; }
    .state-comfy .cd-headline { color: #86efac; }
    .state-soon  .cd-headline { color: #fcd34d; }
    .state-go    .cd-headline { color: #fecaca; }
    .cd-timer {
      font-size: 76px; line-height: 1.02; font-weight: 900; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums; margin: 2px 0 4px;
      text-shadow: 0 2px 30px rgba(255,255,255,.12);
    }
    @media (min-width: 420px) { .cd-timer { font-size: 92px; } }
    /* Longer h:mm:ss countdowns shrink so they never overflow the card. */
    .cd-timer.long { font-size: 52px; }
    @media (min-width: 420px) { .cd-timer.long { font-size: 60px; } }
    .cd-sub { font-size: 14px; color: var(--muted); }
    .cd-sub strong { color: var(--text); }
    .mock-chip {
      font-size: 9px; font-weight: 800; letter-spacing: .06em; vertical-align: middle;
      color: #c7f9ff; background: rgba(34,211,238,.16); border: 1px solid rgba(34,211,238,.4);
      padding: 1px 6px; border-radius: 999px; margin-left: 4px;
    }

    .cd-details { margin: 18px auto 4px; max-width: 360px; text-align: left; }
    .cd-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .cd-row:last-child { border-bottom: none; }
    .cd-k { color: var(--muted); font-size: 13.5px; }
    .cd-v { font-weight: 600; font-size: 13.5px; text-align: right; }

    .cd-legs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0 4px; }
    .leg-pill {
      font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 999px;
      background: var(--card-2); border: 1px solid var(--border); color: var(--muted);
    }
    .leg-pill.on { background: rgba(99,102,241,.25); border-color: var(--brand); color: #e0e7ff; }

    .cd-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .cd-note { font-size: 11.5px; color: var(--muted); margin: 14px 0 0; }

    /* Buttons */
    .btn {
      width: 100%; padding: 15px; font-size: 16px; font-weight: 800; color: #fff;
      border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      box-shadow: 0 6px 18px rgba(99,102,241,0.35);
    }
    .btn:active { transform: translateY(1px); }
    .btn-ghost {
      background: transparent; color: var(--brand-2);
      border: 1px solid var(--border); box-shadow: none;
    }
    .link-btn { background: none; border: none; color: var(--brand-2); font-weight: 700; font-size: 14px; cursor: pointer; padding: 4px; }
    .link-btn.danger { color: #fca5a5; }

    /* ===== Dashboard ===== */
    #dashboard { margin-bottom: 22px; }
    .dash-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .dash-title { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .commute-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
    .commute-card {
      flex: 0 0 auto; width: 210px; text-align: left; cursor: pointer; scroll-snap-align: start;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px;
      color: var(--text);
    }
    .commute-card.active { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), 0 8px 24px rgba(99,102,241,.25); }
    .cc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cc-name { font-weight: 800; font-size: 15px; }
    .cc-sugg { font-size: 9.5px; font-weight: 800; letter-spacing: .04em; color: #052e16; background: var(--comfy); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
    .cc-route { font-size: 13px; color: var(--text); margin: 7px 0 3px; }
    .cc-meta { font-size: 12px; color: var(--muted); }

    /* ===== Onboarding sheet ===== */
    #sheet {
      position: fixed; inset: 0; background: rgba(5,10,20,.6); backdrop-filter: blur(3px);
      display: none; align-items: flex-end; justify-content: center; z-index: 50;
    }
    #sheet.open { display: flex; }
    .sheet-panel {
      width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
      background: var(--bg-bot); border: 1px solid var(--border); border-bottom: none;
      border-radius: 22px 22px 0 0; padding: 10px 18px calc(24px + env(safe-area-inset-bottom));
    }
    .sheet-grip { width: 44px; height: 5px; border-radius: 999px; background: var(--border); margin: 6px auto 14px; }
    .sheet-panel h2 { font-size: 19px; margin: 0 0 16px; }
    .fld { display: block; margin-bottom: 14px; }
    .fld-k { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    .fld input, .fld select {
      width: 100%; padding: 13px 14px; font-size: 15px; color: var(--text);
      border: 1px solid var(--border); border-radius: 12px; background: var(--card-2);
      appearance: none;
    }
    .fld select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2322d3ee' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>");
      background-repeat: no-repeat; background-position: right 14px center;
    }
    .day-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .day-toggle {
      flex: 1 1 auto; min-width: 42px; padding: 10px 4px; font-size: 13px; font-weight: 700; cursor: pointer;
      background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; color: var(--muted);
    }
    .day-toggle.on { background: rgba(99,102,241,.25); border-color: var(--brand); color: #e0e7ff; }
    .legs-edit { margin: 4px 0 12px; }
    .leg-edit { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .leg-edit-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; margin-bottom: 10px; }
    .sheet-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">L</div>
      <h1>LinkWise</h1>
    </div>
    <p class="tagline">Smarter connections, every day.</p>
    <span class="mock-pill">Prototype · illustrative MOCK schedule data · not live transit info</span>

    <!-- Dashboard: saved commutes + suggestion + manual switch -->
    <section id="dashboard"></section>

    <!-- Countdown: the centerpiece -->
    <section id="countdown"></section>
  </div>

  <!-- Onboarding sheet -->
  <div id="sheet">
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <h2>New commute</h2>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script src="app.js?v=1"></script>
</body>
</html>
